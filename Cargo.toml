[workspace]
resolver = "2"
members = ["crates/momreply-core", "crates/momreply-cli"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
momreply-core = { path = "crates/momreply-core" }

# imessage-database 4.2.0 は rusqlite = "=0.40.0" を固定ピンしている。
# ここを揃えないと bundled SQLite が二重にリンクされる。
imessage-database = "4.2.0"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# 仕様書は keyring 3 / reqwest 0.12 を挙げているが、いずれも上位版が現行。
# keyring 4 は API が変わっており delete_password → delete_credential。
keyring = "4"
# reqwest 0.13 で rustls-tls は rustls に改名され、証明書ソースの
# 指定が必須になった。rustls-native-certs は macOS のシステム信頼ストアを使う。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "rustls-native-certs",
    "http2",
    "charset",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
